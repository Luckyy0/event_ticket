services:
  # -----------------------------------------
  # PostgreSQL (Relational DB for Core Services & Keycloak)
  # -----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ticketing_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ticketing_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/pg-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing_net

  # -----------------------------------------
  # pgAdmin (Web-based Management UI for PostgreSQL)
  # -----------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ticketing_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - ticketing_net

  # -----------------------------------------
  # MongoDB (NoSQL DB for Event Catalog)
  # -----------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: ticketing_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing_net

  # -----------------------------------------
  # Redis (In-memory datastore for Distributed Locks & Sessions)
  # -----------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: ticketing_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing_net

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: ticketing_redisinsight
    ports:
      - "8001:8001"
    networks:
      - ticketing_net

  # -----------------------------------------
  # Kafka (KRaft Mode Message Broker)
  # -----------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ticketing_kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ticketing_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ticketing_kafka_ui
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - ticketing_net

  # -----------------------------------------
  # OpenLDAP (Mock Enterprise Identity Provider)
  # -----------------------------------------
  openldap:
    image: osixia/openldap:1.5.0
    container_name: ticketing_openldap
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-Example Org}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.org}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-adminpassword}
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "${LDAP_PORT:-389}:389"
    healthcheck:
      test: ["CMD", "ldapwhoami", "-H", "ldap://localhost:389", "-D", "cn=admin,dc=example,dc=org", "-w", "${LDAP_ADMIN_PASSWORD:-adminpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing_net

  # -----------------------------------------
  # Mailpit (Local SMTP Server & Web UI for Email Verification)
  # -----------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketing_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_WEB_PORT:-8025}:8025" # Web UI
    networks:
      - ticketing_net

  # -----------------------------------------
  # Keycloak (IAM & Centralized Identity Management)
  # -----------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: ticketing_keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id-hint.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret-hint}
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8443}:8080"
    depends_on:
      - postgres
      - openldap
    volumes:
      - ./keycloak/realm-dev.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - ticketing_net

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  ticketing_net:
    driver: bridge
