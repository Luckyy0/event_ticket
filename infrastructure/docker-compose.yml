version: '3.8'

services:
  # -----------------------------------------
  # PostgreSQL (Relational DB for Core Services)
  # -----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ticketing_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticketing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/pg-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing_net

  # -----------------------------------------
  # MongoDB (NoSQL DB for Catalog)
  # -----------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: ticketing_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing_net

  # -----------------------------------------
  # Redis (In-memory datastore for Inventory & Sessions)
  # -----------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: ticketing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing_net

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: ticketing_redisinsight
    ports:
      - "8001:8001"
    networks:
      - ticketing_net

  # -----------------------------------------
  # Kafka (KRaft Mode)
  # -----------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ticketing_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ticketing_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ticketing_kafka_ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - ticketing_net

  # -----------------------------------------
  # OpenLDAP (Mock Enterprise Identity Provider)
  # -----------------------------------------
  openldap:
    image: osixia/openldap:1.5.0
    container_name: ticketing_openldap
    environment:
      LDAP_ORGANISATION: "Example Org"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    volumes:
      - ./ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro
    ports:
      - "389:389"
    networks:
      - ticketing_net

  # -----------------------------------------
  # Mailpit (Local SMTP Server & Web UI for Email Verification)
  # -----------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketing_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - ticketing_net

  # -----------------------------------------
  # Keycloak (IAM)
  # -----------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: ticketing_keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id-hint.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret-hint}
    command: start-dev --import-realm
    ports:
      - "8443:8080"
    depends_on:
      - postgres
      - openldap
    volumes:
      - ./keycloak/realm-dev.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - ticketing_net

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  ticketing_net:
    driver: bridge
