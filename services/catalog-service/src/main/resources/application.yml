server:
  port: 8082

spring:
  application:
    name: catalog-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:rootpassword@localhost:27017/catalog_db?authSource=admin}
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8443/realms/event-ticketing}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8443/realms/event-ticketing/protocol/openid-connect/certs}

mongock:
  migration-scan-package:
    - com.example.catalog.bootstrap.migration
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.data.mongodb: INFO
    io.mongock: INFO
