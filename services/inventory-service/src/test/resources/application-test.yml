spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8443/realms/event-ticketing
          jwk-set-uri: http://localhost:8443/realms/event-ticketing/protocol/openid-connect/certs
